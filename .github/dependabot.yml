# Mises à jour hebdomadaires (08-securite.md § 9) ; pnpm refuse de toute façon les versions trop récentes.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7 # versions publiées depuis au moins une semaine, comme pnpm
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7 # versions publiées depuis au moins une semaine, comme pnpm
