# Weekly updates (08-securite.md § 9); pnpm refuses too recent versions anyway.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7 # versions published at least a week ago, like pnpm
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7 # versions published at least a week ago, like pnpm
