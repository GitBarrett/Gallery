# Production deployment of main, on demand (T-03a, T-04d: not at each merge), smoke test and automatic rollback
# (T-04b). Run it with `gh workflow run deploy-production.yml --ref main` or from the Actions tab.
name: deploy-production

on:
  workflow_dispatch:
    inputs:
      rollback_drill:
        description: Rollback drill (the smoke test fails on purpose after the deployment)
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint && pnpm typecheck && pnpm arch && pnpm test
      - name: Build for Cloudflare Workers
        run: pnpm build
        env:
          NITRO_PRESET: cloudflare_module
          R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }} # R2 host allowed in connect-src (presigned uploads)
      - name: Storybook under /storybook/ (ADR-019)
        run: pnpm exec storybook build --quiet -o .output/public/storybook
      - name: No test route in the production artifact
        run: '! grep -rl "/__test" .output/server'
      # Before the code: backward-compatible migrations (expand → contract, 08-securite.md § 9), as the database owner;
      # Hyperdrive ls-prod switches to the ls_app application role on the first run (T-05a)
      - name: Migrate the database
        run: node scripts/database.mjs production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: calm-mode-49605156
      - name: Deploy
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Browsers downloaded once per Playwright version (T-04d); their system packages still install at each run
      - name: Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - name: Cache the browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      # 11-strategie-de-tests.md § 7: health (database through Hyperdrive, R2) and home page without CSP violation;
      # the reference photo page and image join with their tasks (T-31a, T-25a). Only these specs and the session
      # cookie check (NUXT_APP_SECRET present), not the whole suite: the previews run it (T-04d)
      - name: Smoke test
        id: smoke
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors "$BASE_URL/api/health"
          pnpm exec playwright install --with-deps chromium
          pnpm exec playwright test tests/e2e/smoke.spec.ts tests/e2e/session.spec.ts --project desktop
          if [ "$ROLLBACK_DRILL" = "true" ]; then echo "Drill: failing on purpose"; exit 1; fi
        env:
          BASE_URL: https://legendary-shots.aleygues.workers.dev
          ROLLBACK_DRILL: ${{ inputs.rollback_drill }}
      - name: Roll back to the previous version
        if: failure() && steps.smoke.outcome == 'failure'
        run: |
          pnpm exec wrangler rollback --message "smoke test failed (run ${{ github.run_id }})" --yes
          curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors https://legendary-shots.aleygues.workers.dev/api/health
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
