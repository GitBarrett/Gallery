# Une preview complète par PR (T-03b, ADR-013, ADR-016) : Worker ls-pr-{n}, files, branche Neon, Hyperdrive, préfixe R2.
name: preview-deploy

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy:
    # Pas de preview pour Dependabot : GitHub ne lui transmet pas les secrets ; la CI de la PR s'applique
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build for the preview (test routes included)
        run: pnpm build
        env:
          NITRO_PRESET: cloudflare_module
          NUXT_DEPLOY_ENV: preview
      - name: Create or update the preview
        id: preview
        run: node scripts/preview.mjs up ${{ github.event.pull_request.number }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: calm-mode-49605156
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      # Tests de la preview (T-04b) : le jeton Access n'est envoyé qu'au domaine de la preview (fixture Playwright,
      # scripts/lighthouse.mjs), jamais aux tiers
      - name: Install the browsers
        run: pnpm exec playwright install --with-deps chromium webkit
      - name: End-to-end tests (desktop, iPhone 14, Pixel 7)
        run: pnpm test:e2e
        env:
          CI: true
          BASE_URL: ${{ steps.preview.outputs.url }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      # Pages mesurées : l'accueil ; la PLP et la PDP s'y ajoutent avec leurs tâches (T-30, T-31a)
      - name: Lighthouse (US-68.2)
        if: ${{ !cancelled() && steps.preview.outcome == 'success' }}
        run: node scripts/lighthouse.mjs "$BASE_URL/"
        env:
          BASE_URL: ${{ steps.preview.outputs.url }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      - name: Comment the preview URL
        if: ${{ !cancelled() && steps.preview.outcome == 'success' }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --edit-last --create-if-none \
            --body "Preview : ${{ steps.preview.outputs.url }}"
        env:
          GH_TOKEN: ${{ github.token }}
