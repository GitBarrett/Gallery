# One full preview per pull request (T-03b, ADR-013, ADR-016): Worker ls-pr-{n}, queues, Neon branch, Hyperdrive, R2 prefix.
name: preview-deploy

on:
  pull_request:
    # labeled: adding `e2e-mobile` reruns the preview with the iPhone 14 and Pixel 7 projects
    types: [opened, synchronize, reopened, labeled]
    # Docs-only pull requests change nothing a preview would test (the cleanup tolerates a missing preview)
    paths-ignore: ['docs/**', '**/*.md']

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy:
    # No preview for Dependabot: GitHub does not pass it the secrets; the pull request CI still applies. Another
    # label than `e2e-mobile` changes nothing to test.
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event.action != 'labeled' || github.event.label.name == 'e2e-mobile')
    runs-on: ubuntu-latest
    env:
      # Desktop only by default (23/11/2026, a preview spent 13 min installing the system packages of WebKit);
      # the `e2e-mobile` label adds iPhone 14 (WebKit) and Pixel 7, for the tasks that change the mobile layout
      MOBILE: ${{ contains(github.event.pull_request.labels.*.name, 'e2e-mobile') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build for the preview (test routes included)
        run: pnpm build
        env:
          NITRO_PRESET: cloudflare_module
          NUXT_DEPLOY_ENV: preview
          R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }} # R2 host allowed in connect-src (presigned uploads)
      - name: Storybook under /storybook/ (ADR-019)
        run: pnpm exec storybook build --quiet -o .output/public/storybook
      - name: Create or update the preview
        id: preview
        run: node scripts/preview.mjs up ${{ github.event.pull_request.number }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: calm-mode-49605156
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          PREVIEW_R2_ACCESS_KEY_ID: ${{ secrets.PREVIEW_R2_ACCESS_KEY_ID }}
          PREVIEW_R2_SECRET_ACCESS_KEY: ${{ secrets.PREVIEW_R2_SECRET_ACCESS_KEY }}
      # Preview tests (T-04b): the Access token is only sent to the preview's domain (Playwright fixture,
      # scripts/lighthouse.mjs), never to third parties
      # Browsers downloaded once per Playwright version (T-04d); their system packages still install at each run.
      # Chromium alone shares the key of deploy-production, saved on main, which every pull request can read.
      - name: Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - name: Cache the browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-${{ env.MOBILE == 'true' && 'chromium-webkit' || 'chromium' }}
      - name: Install the browsers
        run: pnpm exec playwright install --with-deps chromium ${{ env.MOBILE == 'true' && 'webkit' || '' }}
      - name: End-to-end tests (desktop; iPhone 14 and Pixel 7 with the e2e-mobile label)
        run: pnpm test:e2e ${{ env.MOBILE != 'true' && '--project=desktop' || '' }}
        env:
          CI: true
          BASE_URL: ${{ steps.preview.outputs.url }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      # Measured pages: the home page; the category and photo pages join with their tasks (T-30, T-31a)
      - name: Lighthouse (US-68.2)
        if: ${{ !cancelled() && steps.preview.outcome == 'success' }}
        run: node scripts/lighthouse.mjs "$BASE_URL/"
        env:
          BASE_URL: ${{ steps.preview.outputs.url }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      - name: Comment the preview URL
        if: ${{ !cancelled() && steps.preview.outcome == 'success' }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --edit-last --create-if-none \
            --body "Preview : ${{ steps.preview.outputs.url }}"
        env:
          GH_TOKEN: ${{ github.token }}
