# Pull request checks (T-04a, 11-strategie-de-tests.md § 7). Each guard is a separate step that runs even when
# another one fails, to see everything in one pass. No protection of main (Q26): a pull request is only merged
# with this CI green.
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    # CI Postgres (Q15), same major version as Neon: integration tests apply the migrations to a blank database
    # and count in the coverage along with unit and component tests
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - id: install
        run: pnpm install --frozen-lockfile
      - name: Lint (ESLint, Prettier)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm lint
      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm typecheck
      - name: Architecture (dependency-cruiser)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm arch
      - name: Unit, component and integration tests with coverage thresholds
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm test:coverage
      - name: Every acceptance criterion has a test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm test:trace
      - name: Migrations match the schema (pnpm db:generate was run)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm db:generate && test -z "$(git status --porcelain server/db/migrations)"
      - name: Production artifact has no test route
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm build && ! grep -rl "/__test" .output/server
        env:
          NITRO_PRESET: cloudflare_module
      # After the Nuxt build, which downloads the fonts (ADR-019): a broken story fails the pull request
      - name: Storybook builds
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm storybook:build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the whole history of the tested branch
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Secrets (gitleaks)
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --log-opts=HEAD --redact --no-banner
      - name: Vulnerable dependencies (high and critical)
        if: ${{ !cancelled() }}
        run: pnpm audit --prod --audit-level high
      # Semgrep CE replaces CodeQL, unavailable on a private repository of a Free account (Q26)
      - name: Static analysis (Semgrep CE)
        if: ${{ !cancelled() }}
        run: pipx run semgrep==1.183.0 scan --config p/default --error --metrics=off
