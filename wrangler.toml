# Production (T-03a). Previews generate their configuration from this file (T-03b, ADR-013).
name = "legendary-shots"
main = ".output/server/index.mjs"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = false

[assets]
directory = ".output/public"
binding = "ASSETS"

[observability]
enabled = true

# Public values; secrets go through `wrangler deploy --secrets-file` (T-00g)
[vars]
NUXT_PUBLIC_SITE_URL = "https://legendary-shots.aleygues.workers.dev"
NUXT_DEPLOY_ENV = "production"
NUXT_FAKE_PROVIDERS = "false"
NUXT_R2_PREFIX = ""
# Bucket of the presigned uploads (T-21); R2_ACCOUNT_ID and the S3 token R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY are secrets
R2_BUCKET = "ls-prod"
# Public values served to the browser (T-03f, Q25)
NUXT_PUBLIC_SENTRY_DSN = "https://cdcf8f3e3a474494448cff10947009ea@o4512469379055616.ingest.de.sentry.io/4512469385412688"
NUXT_PUBLIC_CF_BEACON_TOKEN = "458bbb78a91d42189f5b66bff09f87de" # gitleaks:allow (public: served in every page)
NUXT_PUBLIC_POSTHOG_KEY = "phc_BGKnTyctYSLV3X9RHXfBWxaHDFJQRmYnxSevmfk6pZGt" # gitleaks:allow (public: project key, capture only)
NUXT_PUBLIC_TURNSTILE_SITE_KEY = "0x4AAAAAAGNPHoTNovZ8sqtK" # gitleaks:allow (public: rendered in the signup form)

# Private bucket: originals and variants, never public (ADR-004, ADR-012)
[[r2_buckets]]
binding = "R2"
bucket_name = "ls-prod"

# Neon, main branch; cache disabled (ADR-016)
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "232936a763ef4fcf8d7b25b9bad0e3cb"

[images]
binding = "IMAGES"

# Bursts (T-05c): /api mutations per IP, until zone rules exist (08-securite.md § 2, Q24); window of 10
# or 60 s counted per Cloudflare location, hence approximate. Previews have their own namespace (1002).
[[ratelimits]]
name = "RATE_LIMITER_MUTATIONS"
namespace_id = "1001"
simple = { limit = 120, period = 60 }

# Queues of 03-architecture.md § Files d'attente; each queue has its DLQ. Previews suffix the names with -pr-{n}.
[[queues.producers]]
binding = "PHOTO_PROCESS_QUEUE"
queue = "photo-process"

[[queues.producers]]
binding = "NOTIFICATIONS_QUEUE"
queue = "notifications"

[[queues.producers]]
binding = "EMAILS_QUEUE"
queue = "emails"

[[queues.producers]]
binding = "FEEDBACK_QUEUE"
queue = "feedback"

[[queues.producers]]
binding = "ACCOUNT_PURGE_QUEUE"
queue = "account-purge"

[[queues.consumers]]
queue = "photo-process"
max_retries = 3
retry_delay = 30
dead_letter_queue = "photo-process-dlq"

[[queues.consumers]]
queue = "notifications"
max_retries = 5
dead_letter_queue = "notifications-dlq"

[[queues.consumers]]
queue = "emails"
max_retries = 5
dead_letter_queue = "emails-dlq"

[[queues.consumers]]
queue = "feedback"
max_retries = 5
dead_letter_queue = "feedback-dlq"

[[queues.consumers]]
queue = "account-purge"
max_retries = 5
dead_letter_queue = "account-purge-dlq"

# MVP crons; */5 (contests) and weekly (digest) arrive with their v1.x tasks
[triggers]
crons = ["0 * * * *", "15 3 * * *"]
