# Production (T-03a). Les previews génèrent leur configuration à partir de ce fichier (T-03b, ADR-013).
name = "legendary-shots"
main = ".output/server/index.mjs"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = false

[assets]
directory = ".output/public"
binding = "ASSETS"

[observability]
enabled = true

# Valeurs publiques ; les secrets passent par `wrangler deploy --secrets-file` (T-00g)
[vars]
NUXT_PUBLIC_SITE_URL = "https://legendary-shots.aleygues.workers.dev"
NUXT_DEPLOY_ENV = "production"
NUXT_FAKE_PROVIDERS = "false"
NUXT_R2_PREFIX = ""
# Valeurs publiques servies au navigateur (T-03f, Q25)
NUXT_PUBLIC_SENTRY_DSN = "https://cdcf8f3e3a474494448cff10947009ea@o4512469379055616.ingest.de.sentry.io/4512469385412688"
NUXT_PUBLIC_CF_BEACON_TOKEN = "458bbb78a91d42189f5b66bff09f87de" # gitleaks:allow (public : servi dans chaque page)

# Bucket privé : originaux et variantes, jamais publics (ADR-004, ADR-012)
[[r2_buckets]]
binding = "R2"
bucket_name = "ls-prod"

# Neon, branche principale ; cache désactivé (ADR-016)
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "232936a763ef4fcf8d7b25b9bad0e3cb"

[images]
binding = "IMAGES"

# Files de 03-architecture.md § Files d'attente ; chaque file a sa DLQ. Les previews suffixent les noms par -pr-{n}.
[[queues.producers]]
binding = "PHOTO_PROCESS_QUEUE"
queue = "photo-process"

[[queues.producers]]
binding = "NOTIFICATIONS_QUEUE"
queue = "notifications"

[[queues.producers]]
binding = "EMAILS_QUEUE"
queue = "emails"

[[queues.producers]]
binding = "FEEDBACK_QUEUE"
queue = "feedback"

[[queues.producers]]
binding = "ACCOUNT_PURGE_QUEUE"
queue = "account-purge"

[[queues.consumers]]
queue = "photo-process"
max_retries = 3
retry_delay = 30
dead_letter_queue = "photo-process-dlq"

[[queues.consumers]]
queue = "notifications"
max_retries = 5
dead_letter_queue = "notifications-dlq"

[[queues.consumers]]
queue = "emails"
max_retries = 5
dead_letter_queue = "emails-dlq"

[[queues.consumers]]
queue = "feedback"
max_retries = 5
dead_letter_queue = "feedback-dlq"

[[queues.consumers]]
queue = "account-purge"
max_retries = 5
dead_letter_queue = "account-purge-dlq"

# Crons du MVP ; */5 (concours) et hebdomadaire (récap) arrivent avec leurs tâches v1.x
[triggers]
crons = ["0 * * * *", "15 3 * * *"]
